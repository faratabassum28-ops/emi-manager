<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#12141d" />
    <title>EMI Manager · MySoulSchool</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
    <script>
      // apply the saved theme before first paint so there is no flash (default: dark, like Lead FMS)
      try { var t = localStorage.getItem('emi_theme'); document.documentElement.dataset.theme = t === 'light' ? 'light' : 'dark'; } catch (e) {}
    </script>
    <style>
      body { margin: 0; background: #10121a; }
      :root[data-theme="light"] body { background: #eef1f6; }
      #boot { position: fixed; inset: 0; display: grid; place-items: center; background: inherit; }
      #boot i { width: 34px; height: 34px; border-radius: 50%; border: 3px solid rgba(128,128,160,.3); border-top-color: #6d4fc0; animation: b .8s linear infinite; }
      @keyframes b { to { transform: rotate(360deg); } }
    </style>
  </head>
  <body>
    <div id="root"><div id="boot"><i></i></div></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
